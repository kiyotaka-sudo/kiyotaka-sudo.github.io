apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp-deployment
  labels:
    app: webapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: mbargaernest/mbarga-portfolio:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
