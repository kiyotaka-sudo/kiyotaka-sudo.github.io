apiVersion: batch/v1
kind: Job
metadata:
  name: batch-job
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: batch-container
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Tâche terminée"
              echo "Date : $(date)"
  backoffLimit: 3
