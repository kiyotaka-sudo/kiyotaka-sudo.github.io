apiVersion: batch/v1
kind: CronJob
metadata:
  name: date-cronjob
spec:
  schedule: "* * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: date-container
              image: busybox:1.36
              command:
                - sh
                - -c
                - echo "CronJob exécuté le : $(date)"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
