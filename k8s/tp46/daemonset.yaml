apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: monitoring-daemonset
  labels:
    app: monitoring
spec:
  selector:
    matchLabels:
      app: monitoring
  template:
    metadata:
      labels:
        app: monitoring
    spec:
      containers:
        - name: nginx-monitor
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
