apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-deployment
  labels:
    app: portfolio
    version: v2
spec:
  replicas: 3
  selector:
    matchLabels:
      app: portfolio
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: portfolio
        version: v2
    spec:
      containers:
        - name: portfolio
          image: mbargaernest/mbarga-portfolio:latest
          ports:
            - containerPort: 3000
