apiVersion: v1
kind: Pod
metadata:
  name: pod-correct
  labels:
    app: portfolio
spec:
  containers:
    - name: portfolio-container
      image: mbargaernest/mbarga-portfolio:latest
      ports:
        - containerPort: 3000
      livenessProbe:
        httpGet:
          path: /
          port: 3000
        initialDelaySeconds: 10
        periodSeconds: 15
